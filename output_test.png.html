<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Reconstruction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: #f7f7f7; /* Improved body background color accuracy */
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  color: #333333; /* Improved text color for better contrast */
}
.viewport {
  min-height: 100vh;
  display: block;
  padding: 16px;
  overflow: auto;
  background-color: #f7f7f7; /* Improved viewport background color accuracy */
}
.canvas {
  position: relative;
  width: 800px;
  height: 600px;
  min-width: 800px;
  min-height: 600px;
  margin: 0 auto;
  overflow: hidden;
  background-color: #f7f7f7; /* Improved canvas background color accuracy */
}
.screen-text {
  overflow: visible;
}
.screen-shape {
  overflow: hidden;
}
input::placeholder {
  color: inherit;
  opacity: 1;
}
</style>
</head>
<body>
  <main class="viewport">
    <section class="canvas" aria-label="Generated reconstruction">
    <div class="screen-bg" style="position:absolute;inset:0;background:#ffffff;z-index:1"></div>
    <div class="screen-shape screen-toolbar"  style="position:absolute;left:0px;top:0px;width:800px;height:42px;background:#f6f8fa;border:1px solid #d0d7de;border-bottom:1px solid #d0d7de;border-radius:0px;overflow:visible;z-index:2" data-parent-id="" data-row-id=""></div>
    <div class="screen-shape screen-panel"  style="position:absolute;left:100px;top:420px;width:250px;height:130px;background:#f3f4f6;border:2px solid #c8c8c8;border-radius:8px;overflow:visible;z-index:4" data-parent-id="" data-row-id=""></div>
    <button type="button" style="position:absolute;left:300px;top:200px;width:200px;height:60px;display:flex;align-items:center;justify-content:center;padding:0 8%;color:#111827;font-size:20px;font-weight:600;line-height:1.18;text-align:center;background:#3b82f6;border:1px solid #3b82f6;border-radius:8px;z-index:8;overflow:hidden">Get Started</button>
    <div class="screen-shape screen-input"  style="position:absolute;left:200px;top:320px;width:400px;height:50px;background:#ffffff;border:2px solid #c8c8c8;border-radius:6px;overflow:visible;z-index:9" data-parent-id="" data-row-id=""></div>
    <div class="screen-text" style="position:absolute;left:200px;top:72px;width:380px;min-height:30px;color:#111827;font-size:24px;font-weight:700;line-height:1.18;text-align:left;white-space:pre-wrap;word-break:break-word;overflow:hidden;background:transparent;border:none;z-index:100" data-parent-id="" data-row-id="">Welcome to Our App</div>
    <div class="screen-text" style="position:absolute;left:322px;top:220px;width:140px;min-height:20px;color:#111827;font-size:18px;font-weight:600;line-height:1.18;text-align:left;white-space:pre-wrap;word-break:break-word;overflow:hidden;background:transparent;border:none;z-index:100" data-parent-id="" data-row-id="">Get Started</div>
    <div class="screen-text" style="position:absolute;left:222px;top:337px;width:150px;min-height:18px;color:#6b7280;font-size:16px;font-weight:700;line-height:1.18;text-align:left;white-space:pre-wrap;word-break:break-word;overflow:hidden;background:transparent;border:none;z-index:100" data-parent-id="" data-row-id="">Enter your email</div>
    <div class="screen-text" style="position:absolute;left:130px;top:454px;width:150px;min-height:62px;color:#111827;font-size:17px;font-weight:700;line-height:1.18;text-align:left;white-space:pre-wrap;word-break:break-word;overflow:hidden;background:transparent;border:none;z-index:100" data-parent-id="" data-row-id="">Feature Card
Description text</div>
    </section>
  </main>
</body>
</html>
