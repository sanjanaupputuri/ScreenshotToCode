<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Reconstruction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #433e58;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #24292f;
    }
    .viewport {
      min-height: 100vh;
      display: block;
      padding: 16px;
      overflow: auto;
      background: #433e58;
    }
    .canvas {
      position: relative;
      width: 1920px;
      height: 906px;
      min-width: 1920px;
      min-height: 906px;
      margin: 0 auto;
      overflow: hidden;
      background: #433e58;
    }
    .screen-text {
      overflow: visible;
    }
    .screen-shape {
      overflow: hidden;
    }
    input::placeholder {
      color: inherit;
      opacity: 1;
    }
    /* Ollama enhancements */
  body {font-family:'Arial', sans-serif;} button:hover {opacity:0.9;box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);cursor:pointer;} input:focus {outline: 2px solid #ccc;box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);} button,input {transition: all 0.3s ease-in-out;}
</style>
</head>
