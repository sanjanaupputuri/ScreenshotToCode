<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Screen Reconstruction</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: #232235;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  color: #24292f;
}
.viewport {
  min-height: 100vh;
  display: block;
  padding: 16px;
  overflow: auto;
  background-color: #232235;
}
.canvas {
  position: relative;
  width: 1920px;
  height: 898px;
  min-width: 1920px;
  min-height: 898px;
  margin: 0 auto;
  overflow: hidden;
  background-color: #232235;
}
.screen-text {
  overflow: visible;
}
.screen-shape {
  overflow: hidden;
}
input::placeholder {
  color: inherit;
  opacity: 1;
}</style>
</head>
<body>
  <main class="viewport">
    <section class="canvas" aria-label="Generated reconstruction">
